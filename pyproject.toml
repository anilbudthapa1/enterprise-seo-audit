[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-seo-audit"
version = "1.2.0"
description = "Evidence-driven enterprise SEO audit, scoring and report-generation skill"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Anil Budthapa" }
]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/anilbudthapa1/enterprise-seo-audit"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
